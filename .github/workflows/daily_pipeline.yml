# ============================================================================
# FILE: .github/workflows/daily_pipeline.yml
# ============================================================================
name: AutoScope Daily Pipeline

on:
  schedule:
    - cron: '30 6 * * *' # Runs daily at 06:30 UTC
  workflow_dispatch:      # Allows manual 1-click run from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Scraper, Webhook Sync & Static Site Builder
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_TOKEN: ${{ secrets.GAS_SECRET_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GUMROAD_CHECKOUT_URL: ${{ secrets.GUMROAD_CHECKOUT_URL }}
        run: python3 scraper_engine.py

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4